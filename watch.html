<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Value...</title>
    <style>
      body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f9f9f9; color: #333; }
      .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%, width: 30px; height: 30px; animation: spin 1s linear infinite; margin-bottom: 20px; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360eg); } }
      .container { text-align: center; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="loader" style="margin: 0 auto 15px;"></div>
      <p id="status"> Connecting to secure video vault...</p>
    </div>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const videoId= urlParams.get('id');

      if(videoId) {
        // Fetches the json database from your repository
        fetch('videos.json')
        .then(response => {
          if(!response.ok) {
            throw new Error('Network Error');
          }
          return response.json();
        })
        .then(data => {
          const secureUrl = data[videoId];
          if(secureUrl) {
            // Redirects to self-hosted LinkLock page
            window.location.href = secureUrl;
          } else {
            document.getElementById('status').innerText = "Error: Video ID no found.";
          }
        })
        .catch(error => {
          document.getElementById('status').innerText = "Error loading database.";
          console.error(error);
        });
      } else {
        document.getElementById('status').innerText = "Error: No video ID provided.";
      }
    </script>
  </body>
</html>
